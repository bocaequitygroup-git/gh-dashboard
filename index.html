<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D24">
<title>GH-Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2418; --ink2:#34503F; --page:#E6EDE8; --card:#FFFFFF; --line:#B4C5B9;
  --leaf:#0B6B3A; --leafd:#084D2A; --leaft:#D5EBDC;
  --amber:#8F4B00; --ambert:#FFE2A8; --red:#AE2218; --redt:#FBDCD8;
  --blue:#1A4C85; --bluet:#DAE7F6; --bar:#0B3D24;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E4EFE7; --ink2:#A9C0B1; --page:#0C1A12; --card:#142A1D; --line:#2E4A38;
  --leaf:#4CC27F; --leafd:#8EE0B0; --leaft:#17402A;
  --amber:#F2B04A; --ambert:#3F2C0A; --red:#FF8A7E; --redt:#431512;
  --blue:#82B4EE; --bluet:#142C4A; --bar:#06220F;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.4 var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
[hidden]{display:none!important}

.top{background:var(--bar);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:20}
.top .l1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.top h1{margin:0;font:700 30px/1 var(--disp);letter-spacing:.02em}
.top .sub{font-size:14px;opacity:.85;flex:1;min-width:120px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;padding:4px 10px;border:1px solid rgba(255,255,255,.4);border-radius:99px}
.dot{width:11px;height:11px;border-radius:50%;background:#6FE29B}
.dot.snap{background:#FFD27A}.dot.off{background:#FF8A80}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:2px solid var(--leaf);background:var(--card);font-weight:700;color:var(--leafd)}
.btn.primary{background:var(--leaf);color:#fff}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.top .btn.primary{background:#fff;color:var(--bar)}
.conn{background:var(--card);border-bottom:2px solid var(--line);padding:10px 16px}
.conn form{max-width:1280px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.conn label{display:flex;flex-direction:column;font-size:13px;color:var(--ink2);gap:3px}
.conn input,.conn select{min-height:40px;border:2px solid var(--line);border-radius:8px;padding:0 10px;background:var(--page);min-width:150px}
.conn .url{flex:1;min-width:260px}.conn .url input{width:100%}
.msg{max-width:1280px;margin:0 auto;padding:8px 16px;font-weight:700}
.msg.bad{color:var(--red)}.msg.warn{color:var(--amber)}

main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
h2{font:700 25px/1.1 var(--disp);letter-spacing:.02em;margin:26px 0 4px;display:flex;align-items:baseline;gap:10px}
h2 small{font:400 14px var(--body);color:var(--ink2)}
p.hint{margin:0 0 10px;color:var(--ink2);font-size:15px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:8px;padding:14px;color:var(--ink2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:2px solid var(--line);border-top:8px solid var(--leaf);border-radius:8px;padding:10px 14px}
.kpi.amber{border-top-color:#D98200}.kpi.red{border-top-color:var(--red)}.kpi.blue{border-top-color:var(--blue)}
.kpi b{display:block;font:700 44px/1 var(--disp)}
.kpi span{font-size:14px;color:var(--ink2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{background:var(--card);border:2px solid var(--line);border-left:10px solid var(--leaf);border-radius:8px;padding:11px 14px}
.card.amber{border-left-color:#D98200}.card.red{border-left-color:var(--red)}.card.blue{border-left-color:var(--blue)}.card.grey{border-left-color:#7A8F80}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bed{font:700 22px/1 var(--disp);letter-spacing:.02em}
.tag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--leaft);color:var(--leafd);white-space:nowrap}
.tag.amber{background:var(--ambert);color:var(--amber)}.tag.red{background:var(--redt);color:var(--red)}.tag.blue{background:var(--bluet);color:var(--blue)}.tag.grey{background:var(--page);color:var(--ink2)}
.nm{font-weight:700;margin-top:4px}
.sm{font-size:14px;color:var(--ink2)}
.bar{position:relative;height:16px;border-radius:8px;background:var(--page);border:1px solid var(--line);margin:10px 0 4px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;display:block}
.bar .gr{left:0;background:var(--leaft)}
.bar .win{background:#F2B04A;opacity:.85}
.bar .now{width:3px;background:var(--ink);z-index:2}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}

table{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{font-size:13px;color:var(--ink2);background:var(--page);text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.week{font:700 18px var(--disp);letter-spacing:.03em;margin:14px 0 6px;color:var(--ink2)}
.ev{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:6px}
.ev .d{font-weight:700;min-width:84px}
.note{font-size:13px;color:var(--ink2);margin-top:30px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="l1">
    <h1>GH-Dashboard</h1>
    <span class="sub">VPOS lifecycle &middot; Junction City Ranch greenhouse</span>
    <span class="pill" id="state"><span class="dot snap"></span><span id="stateTxt">Snapshot</span></span>
    <button class="btn primary" id="btnRefresh">Refresh</button>
    <button class="btn" id="btnDemo">Sample view</button>
  </div>
</header>


<div class="msg" id="msg" hidden></div>

<main id="app"></main>

  }).join('');
  const scans = D.scans.slice().sort((a, b) => b.at - a.at).slice(0, 8);
  const tbl = scans.length ? '<div class="twrap"><table><thead><tr><th>Bed</th><th>Cohort</th><th>Scanned</th></tr></thead><tbody>' + scans.map(s => '<tr><td><b>' + esc(s.bed) + '</b></td><td>' + esc(s.cohort || '') + '</td><td>' + esc(fmtStamp(s.at)) + ' <span class="sm">' + esc(ago(s.at)) + '</span></td></tr>').join('') + '</tbody></table></div>' : empty('No bed tag has been scanned yet. Scans from the worker app are recorded against the bed in QR_REGISTRY.');
  return section('Worker location board', D.sessions.length + ' open tasks', cards ? '<div class="grid">' + cards + '</div>' : empty('No workers found.'), 'Where each worker is, from their open task. Tag scans below show the latest beds visited.') +
    '<h2 style="font-size:20px">Recent bed scans</h2>' + tbl;
}
function vExceptions(X, D) {
  const list = D.exceptions.slice().sort((a, b) => (b.open - a.open) || ((b.at || 0) - (a.at || 0)));
  const body = list.length ? '<div class="twrap"><table><thead><tr><th>Status</th><th>Source</th><th>Ref / bed</th><th>Exception</th><th>Reason</th><th>Signed off</th></tr></thead><tbody>' + list.map(e =>
    '<tr><td><span class="tag ' + (e.open ? 'red' : 'grey') + '">' + (e.open ? 'Open' : 'Signed off') + '</span></td><td>' + esc(e.src) + '</td><td><b>' + esc(e.ref) + '</b>' + (e.bed ? '<div class="sm">' + esc(e.bed) + '</div>' : '') + '</td><td>' + esc(e.type) + '</td><td>' + esc(e.note) + '</td><td>' + (e.by ? esc(e.by) : '') + (e.at ? '<div class="sm">' + esc(fmtStamp(e.at)) + '</div>' : '') + '</td></tr>').join('') + '</tbody></table></div>'
    : empty('No exceptions or manager overrides recorded.');
  return section('Exception overrides', X.openExc.length + ' open', body, 'Bed-assignment exceptions, cohort exceptions and manager overrides with their written reasons. Read-only here; sign-off happens in GH Manager.');
}
function events(X, D) {
  const ev = [];
  X.cohorts.forEach(c => {
    if (c.stage === 'PRE' && c.planD) {
      if (c.lead) ev.push({d: addDays(c.planD, -c.lead), k: 'Nursery', t: 'Start ' + c.crop + ' W' + c.wave + (c.recBed || c.bed ? ' for ' + (c.bed || c.recBed) : ''), cls: 'blue'});
      ev.push({d: c.planD, k: 'Plant', t: c.crop + ' W' + c.wave + ' to ' + (c.bed || c.recBed || 'bed TBD') + (c.bed && !c.ver ? ' (verify first)' : ''), cls: c.bed && !c.ver ? 'red' : ''});
      if (c.bed && !c.ver) ev.push({d: addDays(c.planD, -2), k: 'Gate', t: 'Verify bed ' + c.bed + ' ready for ' + c.crop, cls: 'amber'});
    }
    if (c.stage === 'PRE' && c.planD && c.hsD) ev.push({d: c.hsD, k: 'Harvest', t: c.crop + ' W' + c.wave + ' window opens', cls: 'amber'});
    if ((c.stage === 'GROWING' || c.stage === 'READY') && c.bed) {
      if (c.hsD && c.stage === 'GROWING') ev.push({d: c.hsD, k: 'Harvest', t: c.crop + ' on ' + c.bed + ' window opens', cls: 'amber'});
      const ls = lastScout(D, c), base = ls ? new Date(ls.at) : c.dobD;
      if (base) ev.push({d: addDays(new Date(base.getFullYear(), base.getMonth(), base.getDate()), SCOUT_DAYS), k: 'Scout', t: 'Scout ' + c.bed + ' (' + c.crop + ')', cls: 'blue'});
    }
  });
  return ev.sort((a, b) => a.d - b.d);
}
function vCalendar(X, D) {
  const ev = events(X, D), t = X.today, within = ev.filter(e => e.d >= addDays(t, -14));
  const show = (within.filter(e => e.d <= addDays(t, 60)).length ? within.filter(e => e.d <= addDays(t, 60)) : within).slice(0, 40);
  const wk = d => { const s = addDays(d, -d.getDay()); return s; };
  let html = '', cur = '';
  show.forEach(e => { const w = wk(e.d), key = iso(w); if (key !== cur) { cur = key; html += '<div class="week">Week of ' + esc(fmtDay(w)) + '</div>'; }
    html += '<div class="ev"><span class="d">' + esc(e.d.toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'})) + '</span><span class="tag ' + (e.cls || '') + '">' + esc(e.k) + '</span><span>' + esc(e.t) + (e.d < t ? ' <span class="sm">(past)</span>' : '') + '</span></div>'; });
  const first = ev.find(e => e.d >= t), gap = first && diffDays(first.d, t) > 60 ? 'Nothing is scheduled in the next 60 days. Showing the first scheduled items, starting ' + fmtDay(first.d) + '.' : '';
  return section('Schedule', show.length ? show.length + ' items' : '', show.length ? html : empty('No dated items yet.'), 'Nursery start dates (planned date of birth minus propagation lead time), planting, verification gates, harvest windows and the 7-day scout cycle. ' + gap);
}
function vBeds(D) {
  const occ = {}; D.cohorts.forEach(c => { if (c.bed && !['RELEASED', 'TERMINATED', 'HARVEST_COMPLETE'].includes(c.status)) occ[c.bed] = c; });
  const bays = {}; D.beds.forEach(b => { (bays[b.bay] = bays[b.bay] || {name: b.bayName, zone: b.zone, beds: []}).beds.push(b); });
  const html = Object.keys(bays).map(k => { const y = bays[k]; const used = y.beds.filter(b => occ[b.id]).length;
    return '<div class="card ' + (used ? '' : 'grey') + '"><div class="ct"><span class="bed">' + esc(k) + '</span><span class="tag ' + (used ? '' : 'grey') + '">' + used + ' of ' + y.beds.length + ' beds in use</span></div><div class="nm">' + esc(y.name) + '</div><div class="sm">' + esc(y.zone) + '</div></div>'; }).join('');
  return section('Bays', Object.keys(bays).length, '<div class="grid">' + html + '</div>');
}

function render() {
  const D = S.data, X = derive(D);
  $('app').innerHTML = vKpis(X) + vPending(X) + vActive(X) + vWatch(X, D) + vWorkers(X, D) + vExceptions(X, D) + vCalendar(X, D) + vBeds(D) +
    '<p class="note">' + (S.mode === 'live' ? 'Live from the VPOS-GH sheet. Read-only; refreshes every minute or when you tap Refresh.' : S.mode === 'sample' ? 'Sample activity is illustrative and is not saved anywhere. Tap Back to live for real data.' : 'Snapshot of the planned 2027 cohorts as exported ' + esc(SNAPSHOT_DATE) + '. Tap Refresh to retry the live connection.') + '</p>';
}

/* ---------- sample activity (labelled, illustrative) ---------- */
function sampleData() {
  const D = JSON.parse(JSON.stringify(SNAPSHOT)), t = startOfToday(), at = n => Date.now() - n * 36e5, dd = n => iso(addDays(t, n));
  const mk = (i, over) => { const c = D.cohorts[i]; Object.assign(c, over, {bed: c.recBed}); return c; };
  const gA = mk(14, {status: 'GROWING', ver: true, dob: dd(-34), planned: dd(-34)});
  mk(30, {status: 'GROWING', ver: true, dob: dd(-8), planned: dd(-8)});
  const rdy = mk(40, {status: 'HARVEST_READY', ver: true, dob: dd(-52), planned: dd(-52), hs: dd(-3), he: dd(11)});
  const pend = mk(52, {status: 'PRE_PLANTING', ver: false, planned: dd(2)});
  mk(60, {status: 'PRE_PLANTING', ver: true, planned: dd(6)});
  const exc = mk(70, {status: 'PRE_PLANTING', ver: false, planned: dd(12)});
  D.cohorts.filter(c => !c.bed).slice(0, 3).forEach((c, i) => { c.planned = dd(20 + i * 7); });
  D.sessions = [{sid: 'S1', worker: 'lisa', name: 'Lisa Griffin', bed: rdy.bed, act: 'Harvest', st: 'ACTIVE', mins: 42, pr: ''}, {sid: 'S2', worker: 'james', name: 'James Clay', bed: gA.bed, act: 'Scouting', st: 'PAUSED', mins: 18, pr: 'Waiting on irrigation'}, {sid: 'S3', worker: 'jon', name: 'Jon Creem', bed: pend.bed, act: 'Pull Plastic & Drip', st: 'ASSIGNED', mins: ''}];
  D.log = [{bed: 'GH-1-R01', act: 'Pre-Plant Flush & Sanitization', worker: 'Jessica Luka', end: at(1), min: 19, qty: '1 bed'}, {bed: D.cohorts[30].bed, act: 'Transplant', worker: 'Linda May', end: at(5), min: 95, qty: '120 plants'}];
  D.scouts = [{id: 'F1', at: at(24 * 6.5), worker: 'James Clay', bed: gA.bed, cohort: '', act: 'Pest scouting', result: 'Moderate', value: '', unit: '', sev: 2, note: 'Light aphids on lower leaves', status: 'OPEN'},
    {id: 'F2', at: at(30), worker: 'Jessica Luka', bed: rdy.bed, cohort: '', act: 'Disease scouting', result: 'High', value: '', unit: '', sev: 3, note: 'Leaf spot on two plants, isolate', status: 'OPEN'}];
  D.scans = [{code: 'QR-0001', bed: rdy.bed, cohort: rdy.id, at: at(1)}, {code: 'QR-0002', bed: gA.bed, cohort: gA.id, at: at(3)}];
  D.exceptions = [{src: 'Bed assignment', ref: exc.id, bed: exc.bed, type: 'Zoning: moved off recommended bed', note: 'Recommended bed unavailable', by: '', at: null, open: true},
    {src: 'Manager override', ref: 'SESS-000009', bed: pend.bed, type: 'Pull Plastic & Drip', note: 'Done before app rollout', by: 'Chris Kenny', at: at(70), open: false}];
  D.issues = [];
  return D;
}

/* ---------- wire up ---------- */
$('btnRefresh').addEventListener('click', () => { if (S.mode === 'sample') S.mode = 'off'; pull(true); });
$('btnDemo').addEventListener('click', () => {
  if (S.mode === 'sample') { S.mode = 'off'; S.data = SNAPSHOT; setState(); render(); pull(); return; }
  S.mode = 'sample'; S.data = sampleData(); say(''); setState(); render();
});
S.mode = 'load'; setState(); render(); pull();
setInterval(() => { if (S.mode === 'live' && !document.hidden) pull(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.mode === 'live' && Date.now() - S.at > 30000) pull(); });
</script>
</body>
