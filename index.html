<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D24">
<title>GH-Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2418; --ink2:#34503F; --page:#E6EDE8; --card:#FFFFFF; --line:#B4C5B9;
  --leaf:#0B6B3A; --leafd:#084D2A; --leaft:#D5EBDC;
  --amber:#8F4B00; --ambert:#FFE2A8; --red:#AE2218; --redt:#FBDCD8;
  --blue:#1A4C85; --bluet:#DAE7F6; --bar:#0B3D24;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E4EFE7; --ink2:#A9C0B1; --page:#0C1A12; --card:#142A1D; --line:#2E4A38;
  --leaf:#4CC27F; --leafd:#8EE0B0; --leaft:#17402A;
  --amber:#F2B04A; --ambert:#3F2C0A; --red:#FF8A7E; --redt:#431512;
  --blue:#82B4EE; --bluet:#142C4A; --bar:#06220F;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.4 var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
[hidden]{display:none!important}

.top{background:var(--bar);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:20}
.top .l1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.top h1{margin:0;font:700 30px/1 var(--disp);letter-spacing:.02em}
.top .sub{font-size:14px;opacity:.85;flex:1;min-width:120px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;padding:4px 10px;border:1px solid rgba(255,255,255,.4);border-radius:99px}
.dot{width:11px;height:11px;border-radius:50%;background:#6FE29B}
.dot.snap{background:#FFD27A}.dot.off{background:#FF8A80}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:2px solid var(--leaf);background:var(--card);font-weight:700;color:var(--leafd)}
.btn.primary{background:var(--leaf);color:#fff}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.top .btn.primary{background:#fff;color:var(--bar)}
.conn{background:var(--card);border-bottom:2px solid var(--line);padding:10px 16px}
.conn form{max-width:1280px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.conn label{display:flex;flex-direction:column;font-size:13px;color:var(--ink2);gap:3px}
.conn input,.conn select{min-height:40px;border:2px solid var(--line);border-radius:8px;padding:0 10px;background:var(--page);min-width:150px}
.conn .url{flex:1;min-width:260px}.conn .url input{width:100%}
.msg{max-width:1280px;margin:0 auto;padding:8px 16px;font-weight:700}
.msg.bad{color:var(--red)}.msg.warn{color:var(--amber)}

main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
h2{font:700 25px/1.1 var(--disp);letter-spacing:.02em;margin:26px 0 4px;display:flex;align-items:baseline;gap:10px}
h2 small{font:400 14px var(--body);color:var(--ink2)}
p.hint{margin:0 0 10px;color:var(--ink2);font-size:15px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:8px;padding:14px;color:var(--ink2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:2px solid var(--line);border-top:8px solid var(--leaf);border-radius:8px;padding:10px 14px}
.kpi.amber{border-top-color:#D98200}.kpi.red{border-top-color:var(--red)}.kpi.blue{border-top-color:var(--blue)}
.kpi b{display:block;font:700 44px/1 var(--disp)}
.kpi span{font-size:14px;color:var(--ink2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{background:var(--card);border:2px solid var(--line);border-left:10px solid var(--leaf);border-radius:8px;padding:11px 14px}
.card.amber{border-left-color:#D98200}.card.red{border-left-color:var(--red)}.card.blue{border-left-color:var(--blue)}.card.grey{border-left-color:#7A8F80}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bed{font:700 22px/1 var(--disp);letter-spacing:.02em}
.tag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--leaft);color:var(--leafd);white-space:nowrap}
.tag.amber{background:var(--ambert);color:var(--amber)}.tag.red{background:var(--redt);color:var(--red)}.tag.blue{background:var(--bluet);color:var(--blue)}.tag.grey{background:var(--page);color:var(--ink2)}
.nm{font-weight:700;margin-top:4px}
.sm{font-size:14px;color:var(--ink2)}
.bar{position:relative;height:16px;border-radius:8px;background:var(--page);border:1px solid var(--line);margin:10px 0 4px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;display:block}
.bar .gr{left:0;background:var(--leaft)}
.bar .win{background:#F2B04A;opacity:.85}
.bar .now{width:3px;background:var(--ink);z-index:2}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}

table{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{font-size:13px;color:var(--ink2);background:var(--page);text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.twrap{overflow-x:auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.week{font:700 18px var(--disp);letter-spacing:.03em;margin:14px 0 6px;color:var(--ink2)}
.ev{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:6px}
.ev .d{font-weight:700;min-width:84px}
.note{font-size:13px;color:var(--ink2);margin-top:30px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
/* GCAL:CSS-START - each page sets --g-pn --g-bg --g-tx --g-mu --g-ln --g-ac --g-av on .gcal (see the page's own :root mapping) */
.gcal{color:var(--g-tx);font:inherit;--tc:#2E7D32}
.gctabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 6px}
.gctab{position:relative;text-align:left;border:2px solid var(--g-ln);border-left:8px solid var(--tc);background:var(--g-pn);color:var(--g-tx);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0;cursor:pointer;font:inherit}
.gctab b{font-size:1.08em}.gctab .gcsub{font-size:.84em;color:var(--g-mu)}
.gctab[aria-selected=true]{background:var(--tc);border-color:var(--tc);color:#fff}.gctab[aria-selected=true] .gcsub{color:#ffffffe0}
.gcbad{position:absolute;top:6px;right:8px;font-style:normal;font-size:.72em;font-weight:700;background:#B3261E;color:#fff;border-radius:99px;padding:1px 7px;border:1px solid #fff8}
.gcblurb{font-size:.86em;color:var(--g-mu);margin:0 2px 8px}
.gctb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.gcsp{flex:1}
.gcseg{display:inline-flex;border:1px solid var(--g-ln);border-radius:8px;overflow:hidden}
.gcseg button{border:0;background:var(--g-pn);padding:6px 14px;cursor:pointer;color:var(--g-tx);min-height:34px;font:inherit}.gcseg button.on{background:var(--tc);color:#fff;font-weight:700}
.gcchip{border:1px solid var(--g-ln);background:var(--g-pn);border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit;font-size:.88em;color:var(--g-tx);min-height:32px}.gcchip.on{color:#fff;border-color:transparent;font-weight:700}
.gcbtn{border:1px solid var(--g-ac);background:transparent;color:var(--g-ac);border-radius:7px;padding:5px 11px;cursor:pointer;min-height:34px;font:inherit;font-weight:700}
.gcsel{border:1px solid var(--g-ln);background:var(--g-pn);color:var(--g-tx);border-radius:7px;padding:5px 8px;min-height:34px;font:inherit}
.gcbn{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:.92em;border:1px solid}
.gcbn.bad{background:rgba(179,38,30,.13);border-color:#B3261E}.gcbn.ok{background:rgba(46,125,50,.15);border-color:#2E7D32}
.gcnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 8px}.gcrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gcttl{min-width:150px;text-align:center;font-size:1.1em}.gcmu{font-size:.88em;color:var(--g-mu)}
.gcg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--g-ln);border:1px solid var(--g-ln);border-radius:8px;overflow:hidden}
.gcgh{background:var(--g-bg);text-align:center;font-size:.78em;font-weight:700;color:var(--g-mu);padding:4px 0}
.gccell{background:var(--g-pn);min-height:84px;padding:3px;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;cursor:pointer;color:var(--g-tx);min-width:0;font:inherit}
.gccell.out{background:var(--g-bg);cursor:default}.gccell:hover:not(.out){background:var(--g-av)}
.gccell.sel{outline:2px solid var(--tc);outline-offset:-2px}.gccell.today .gcn{background:var(--tc);color:#fff;border-radius:99px}
.gcn{font-size:.82em;font-weight:700;align-self:flex-start;min-width:20px;height:20px;line-height:20px;text-align:center}
.gcch{display:block;color:#fff;font-size:.76em;line-height:1.35;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcch.late{outline:2px solid #B3261E;outline-offset:-1px;font-weight:700}.gcch.done{opacity:.5}
.gcmore{font-size:.74em;color:var(--g-mu)}.gcdots{display:none;gap:2px;flex-wrap:wrap}.gcdots i{width:7px;height:7px;border-radius:50%;display:block}
.gcdet{margin-top:10px;border:1px solid var(--g-ln);border-radius:8px;padding:10px 12px;background:var(--g-pn)}
.gcwk{background:var(--g-bg);margin:12px 0 0;padding:5px 10px;font-size:.8em;font-weight:700;color:var(--g-mu);border-radius:6px}
.gcr{display:grid;grid-template-columns:116px minmax(0,1fr);gap:4px 12px;padding:9px 4px;border-bottom:1px solid var(--g-ln)}.gcr.nd{grid-template-columns:1fr;padding:8px 0;border-bottom:0;border-top:1px solid var(--g-ln);margin-top:8px}
.gcrd b{display:block}.gcrd span{font-size:.82em;color:var(--g-mu)}
.gctag{display:inline-block;color:#fff;font-size:.76em;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.gcm{font-size:.86em;color:var(--g-mu);margin-top:2px}.gcx{color:var(--g-mu);font-weight:600}
.gcem{padding:26px 16px;text-align:center;color:var(--g-mu);border:2px dashed var(--g-ln);border-radius:8px}
.gcnote{font-size:.8em;color:var(--g-mu);margin-top:12px}
@media(max-width:700px){.gccell{min-height:50px}.gcch,.gcmore{display:none}.gcdots{display:flex}.gcttl{min-width:0}.gctab{padding:7px 8px;border-left-width:6px}.gctab .gcsub{font-size:.76em}.gcbad{position:static;align-self:flex-start;margin-top:3px}.gcr{grid-template-columns:1fr}}
/* GCAL:CSS-END */

.gcal{--g-pn:var(--card);--g-bg:var(--page);--g-tx:var(--ink);--g-mu:var(--ink2);--g-ln:var(--line);--g-ac:var(--leaf);--g-av:var(--leaft)}
.gcal .gcbtn{border-width:2px}
</style>
</head>
<body>
<header class="top">
  <div class="l1">
    <h1>GH-Dashboard</h1>
    <span class="sub">VPOS lifecycle &middot; Junction City Ranch greenhouse</span>
    <span class="pill" id="state"><span class="dot snap"></span><span id="stateTxt">Snapshot</span></span>
    <button class="btn primary" id="btnRefresh">Refresh</button>
    <button class="btn" id="btnDemo">Sample view</button>
  </div>
</header>


<div class="msg" id="msg" hidden></div>

<main id="app"></main>

<script>
/* ======================================================================
   GH-Dashboard: read-only. Live data comes from the 'dash' action of Code_GH.gs.
   Snapshot = the planned 2027 cohorts exported from VPOS-GH. Sample = labelled, illustrative activity.
   ====================================================================== */
/* GCAL:START - shared production calendars (Propagation / Planting / Harvest). Same block lives in gh_ranch_aab.html and gh_dashboard.html. */
const GCAL=(()=>{
const CALS={
 prop:{name:'Propagation',blurb:'Nursery sowing and harden-off',c:'#2E7D32',types:['sow','harden'],main:['sow','harden']},
 plant:{name:'Planting',blurb:'Transplants out to beds, and crops that go straight into the bed (seed, slips, cuttings, crowns)',c:'#1F6FB2',types:['plant','direct'],main:['plant','direct']},
 harv:{name:'Harvest',blurb:'First-harvest windows',c:'#B3571B',types:['ready','close'],main:['ready']}};
const TY={
 sow:{l:'Sow in nursery',s:'Sow',p:'nursery sowings',c:'#2E7D32'},
 harden:{l:'Start harden-off',s:'Harden',p:'harden-offs',c:'#8F5F00'},
 plant:{l:'Plant out',s:'Plant',p:'plant-outs',c:'#1F6FB2'},
 direct:{l:'Direct to bed',s:'Direct',p:'direct plantings',c:'#5B3FA8'},
 ready:{l:'Harvest window opens',s:'Harvest',p:'windows opening',c:'#B3571B'},
 close:{l:'Harvest window closes',s:'Last day',p:'windows closing',c:'#7A3E14'}};
const ORDER=Object.keys(TY),CALKEYS=Object.keys(CALS);
const calOf=t=>CALKEYS.find(k=>CALS[k].types.includes(t));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const add=(s,n)=>{const x=new Date(s+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fmt=(s,o)=>s?new Date(s+'T00:00:00Z').toLocaleDateString('en-US',Object.assign({month:'short',day:'numeric',year:'numeric',timeZone:'UTC'},o||{})):'-';
const wkStart=s=>add(s,-new Date(s+'T00:00:00Z').getUTCDay());
const shiftM=(m,k)=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+k,1)).toISOString().slice(0,7);
const waveOf=e=>e.wave||((String(e.id||'').match(/W(\d+)$/)||[])[1]|0)||0;
const uniq=a=>[...new Set(a.filter(Boolean))];
const defBay=b=>String(b||'').split('-').slice(0,2).join('-');

function create(cfg){
 const st={tab:null,bay:'ALL',t:{}},today=()=>cfg.today(),bayOf=cfg.bayOf||defBay;
 let host=null,focus=null;
 const ts=k=>st.t[k]||(st.t[k]={view:'month',mon:null,day:'',range:null,off:k=='harv'?{close:true}:{}});
 const late=e=>!e.done&&(e.t=='sow'||e.t=='harden'||e.t=='plant'||e.t=='direct')&&e.d<today();
 const nowOpen=e=>e.t=='ready'&&!e.done&&e.d<=today()&&(!e.he||e.he>=today());
 const missed=e=>e.t=='ready'&&!e.done&&e.he&&e.he<today();
 const evAll=()=>(cfg.events()||[]).filter(e=>e&&e.d&&TY[e.t]&&(st.bay=='ALL'||bayOf(e.bed)==st.bay));
 const evCal=(all,k)=>all.filter(e=>calOf(e.t)==k);
 const vis=(evs,T)=>evs.filter(e=>!T.off[e.t]);
 const sorter=(a,b)=>a.d<b.d?-1:a.d>b.d?1:ORDER.indexOf(a.t)-ORDER.indexOf(b.t)||(a.crop<b.crop?-1:a.crop>b.crop?1:waveOf(a)-waveOf(b));
 function groups(evs){const m={},o=[];evs.slice().sort(sorter).forEach(e=>{const k=e.d+'|'+e.t+'|'+e.crop;if(!m[k]){m[k]=[];o.push(m[k])}m[k].push(e)});return o}

 /* ---- which range / month to open on ---- */
 function ranges(k,evs){const t=today(),r=[],o=evs.filter(late).length,n=evs.filter(nowOpen).length;
  const up=lim=>evs.filter(e=>e.d>=t&&e.d<=lim);
  if(k=='harv'&&n)r.push(['now','Open now',n]);if(k!='harv'&&o)r.push(['over','Overdue',o]);
  r.push(['14','Next 14 days',up(add(t,14)).length],['30','Next 30 days',up(add(t,30)).length],['90','Next 90 days',up(add(t,90)).length],['all','All upcoming',up('9999-12-31').length],['past','Last 30 days',evs.filter(e=>e.d<t&&e.d>=add(t,-30)).length]);return r}
 function rangeEvs(T,evs){const t=today(),r=T.range;
  if(r=='over')return evs.filter(late);if(r=='now')return evs.filter(nowOpen);
  if(r=='past')return evs.filter(e=>e.d<t&&e.d>=add(t,-30));
  const lim=r=='all'?'9999-12-31':add(t,+r);return evs.filter(e=>e.d>=t&&e.d<=lim)}
 function initTab(k,evs){const T=ts(k),t=today();
  if(!T.range){const rs=ranges(k,evs);T.range=(rs.find(x=>x[0]=='over'||x[0]=='now')||rs.find(x=>['30','90','all'].includes(x[0])&&x[2]>0)||rs[1])[0]}
  if(!T.mon){const tm=t.slice(0,7),ms=uniq(evs.map(e=>e.d.slice(0,7))).sort();T.mon=ms.includes(tm)?tm:(ms.find(m=>m>tm)||ms[ms.length-1]||tm)}
  const inM=evs.filter(e=>e.d.slice(0,7)==T.mon).map(e=>e.d).sort();
  if(!T.day||T.day.slice(0,7)!=T.mon)T.day=t.slice(0,7)==T.mon?t:(inM[0]||T.mon+'-01')}
 function pickTab(all){const t=today(),w=add(t,7);
  for(const k of CALKEYS)if(evCal(all,k).some(e=>late(e)||nowOpen(e)))return k;
  for(const k of CALKEYS)if(evCal(all,k).some(e=>!e.done&&CALS[k].main.includes(e.t)&&e.d>=t&&e.d<=w))return k;
  for(const k of CALKEYS)if(evCal(all,k).some(e=>!e.done&&e.d>=t))return k;return'prop'}

 /* ---- rendering pieces ---- */
 function tabs(all){const t=today(),w=add(t,7);
  return `<div class="gctabs" role="tablist" aria-label="Production calendars">${CALKEYS.map(k=>{const c=CALS[k],ev=evCal(all,k),main=ev.filter(e=>c.main.includes(e.t)&&!e.done),o=ev.filter(late).length,n=ev.filter(nowOpen).length,wk=main.filter(e=>e.d>=t&&e.d<=w).length,nx=main.filter(e=>e.d>=t).sort(sorter)[0];
   const sub=k=='harv'&&n?n+' open now':wk?wk+' in next 7 days':nx?'Next: '+fmt(nx.d,{year:undefined}):ev.length?'All done':'Nothing scheduled';
   return `<button class="gctab" role="tab" aria-selected="${st.tab==k}" data-g="tab" data-v="${k}" style="--tc:${c.c}"><b>${c.name}</b><span class="gcsub">${esc(sub)}</span>${o?`<i class="gcbad">${o} overdue</i>`:''}</button>`}).join('')}</div>`}
 function toolbar(k,T,evs){const c=CALS[k];
  const view=`<span class="gcseg" role="group" aria-label="View"><button data-g="view" data-v="month" class="${T.view=='month'?'on':''}" aria-pressed="${T.view=='month'}">Month</button><button data-g="view" data-v="list" class="${T.view=='list'?'on':''}" aria-pressed="${T.view=='list'}">Agenda</button></span>`;
  const chips=c.types.map(t=>`<button class="gcchip ${T.off[t]?'':'on'}" data-g="ty" data-v="${t}" aria-pressed="${!T.off[t]}" style="${T.off[t]?'':`background:${TY[t].c}`}">${TY[t].l}</button>`).join('');
  const bl=typeof cfg.bays=='function'?cfg.bays():cfg.bays,bays=bl&&bl.length>1?`<select class="gcsel" id="gc-bay" aria-label="Bay"><option value="ALL">All bays</option>${bl.map(b=>`<option value="${esc(b[0])}" ${st.bay==b[0]?'selected':''}>${esc(b[1])}</option>`).join('')}</select>`:'';
  return `<div class="gctb">${view}${chips}${bays}<span class="gcsp"></span><button class="gcbtn" data-g="csv">Download CSV</button>${cfg.print?'<button class="gcbtn" data-g="print">Print</button>':''}</div>`}
 function banners(k,evs){let h='';const o=evs.filter(late).length,n=evs.filter(nowOpen).length,m=evs.filter(missed).length;
  if(o)h+=`<div class="gcbn bad"><span><b>${o}</b> ${k=='prop'?'nursery task'+(o==1?' is':'s are'):'planting'+(o==1?' is':'s are')} overdue.</span><button class="gcbtn" data-g="goto" data-v="over">Show overdue</button></div>`;
  if(n)h+=`<div class="gcbn ok"><span><b>${n}</b> cohort${n==1?' is':'s are'} inside the harvest window right now.</span><button class="gcbtn" data-g="goto" data-v="now">Show open now</button></div>`;
  if(m)h+=`<div class="gcbn bad"><span><b>${m}</b> cohort${m==1?' has':'s have'} passed the end of the harvest window without being marked complete.</span></div>`;
  return h}

    return {c, ls, since, state, cls, rank: cls === 'red' ? 0 : cls === 'amber' ? 1 : 2};
  }).sort((a, b) => a.rank - b.rank);
  const table = rows.length ? '<div class="twrap"><table><thead><tr><th>Bed</th><th>Crop</th><th>Last scouted</th><th>Worst finding</th><th>Status</th></tr></thead><tbody>' + rows.map(r =>
    '<tr><td><b>' + esc(r.c.bed) + '</b></td><td>' + esc(r.c.crop) + '</td><td>' + (r.ls ? esc(fmtStamp(r.ls.at)) + '<div class="sm">' + esc(r.ls.worker) + '</div>' : '<span class="sm">none</span>') + '</td><td>' +
    (r.ls ? '<span class="tag ' + sevCls(r.ls.sev) + '">' + esc(sevLabel(r.ls)) + '</span> ' + esc(r.ls.act) + (r.ls.value !== '' && r.ls.value != null ? ' <span class="sm">' + esc(r.ls.value) + ' ' + esc(r.ls.unit || '') + '</span>' : '') : '') + '</td><td><span class="tag ' + r.cls + '">' + esc(r.state) + '</span></td></tr>').join('') + '</tbody></table></div>'
    : empty('Planted cohorts are scouted every ' + SCOUT_DAYS + ' days. They will be listed here once something is growing.');
  const feed = D.scouts.filter(s => s.sev >= 1 && s.status !== 'CLOSED' && s.status !== 'RESOLVED').sort((a, b) => (b.sev - a.sev) || (b.at - a.at)).slice(0, 8).map(s =>
    '<div class="card ' + (s.sev >= 4 ? 'red' : s.sev === 3 ? 'amber' : 'grey') + '"><div class="ct"><span class="bed">' + esc(s.bed) + '</span><span class="tag ' + sevCls(s.sev) + '">' + esc(sevLabel(s)) + '</span></div>' +
    '<div class="nm">' + esc(s.act || 'Scouting note') + '</div>' + (s.note ? '<div class="sm">' + esc(s.note) + '</div>' : '') + '<div class="sm">' + esc(s.worker) + ', ' + esc(fmtStamp(s.at)) + '</div></div>').join('');
  return section('Crop watchguard', rows.filter(r => r.rank < 2).length ? rows.filter(r => r.rank < 2).length + ' need scouting' : '', table, 'Seven-day scouting cadence per planted bed, from worker scouting reports.') +
    (feed ? '<h2 style="font-size:20px">Open findings</h2><div class="grid">' + feed + '</div>' : '');
}
function vWorkers(X, D) {
  const cards = D.workers.map(w => {
    const ss = D.sessions.filter(s => String(s.worker).toLowerCase() === w.id.toLowerCase());
    const live = ss.find(s => s.st === 'ACTIVE') || ss.find(s => s.st === 'PAUSED'), next = ss.find(s => s.st === 'ASSIGNED');
    const last = D.log.filter(l => l.worker === w.name).sort((a, b) => (b.end || 0) - (a.end || 0))[0];
    let tag, cls, body;
    if (live) { cls = live.st === 'PAUSED' ? 'amber' : ''; tag = live.st === 'PAUSED' ? 'Paused' : 'Working'; body = '<div class="nm">' + esc(live.act) + '</div><div class="sm">' + esc(live.bed) + ', ' + esc(live.mins) + ' min' + (live.pr ? ', ' + esc(live.pr) : '') + '</div>'; }
    else if (next) { cls = 'blue'; tag = 'Assigned'; body = '<div class="nm">' + esc(next.act) + '</div><div class="sm">' + esc(next.bed) + ', not started</div>'; }
    else { cls = 'grey'; tag = 'No open task'; body = '<div class="sm">Nothing assigned right now.</div>'; }
    return '<div class="card ' + cls + '"><div class="ct"><span class="bed">' + esc(w.name) + '</span><span class="tag ' + cls + '">' + tag + '</span></div>' + body + (last ? '<div class="sm">Last finished: ' + esc(last.act) + ' on ' + esc(last.bed) + (last.end ? ', ' + esc(ago(last.end)) : '') + '</div>' : '') + '</div>';
  }).join('');
  const scans = D.scans.slice().sort((a, b) => b.at - a.at).slice(0, 8);
  const tbl = scans.length ? '<div class="twrap"><table><thead><tr><th>Bed</th><th>Cohort</th><th>Scanned</th></tr></thead><tbody>' + scans.map(s => '<tr><td><b>' + esc(s.bed) + '</b></td><td>' + esc(s.cohort || '') + '</td><td>' + esc(fmtStamp(s.at)) + ' <span class="sm">' + esc(ago(s.at)) + '</span></td></tr>').join('') + '</tbody></table></div>' : empty('No bed tag has been scanned yet. Scans from the worker app are recorded against the bed in QR_REGISTRY.');
  return section('Worker location board', D.sessions.length + ' open tasks', cards ? '<div class="grid">' + cards + '</div>' : empty('No workers found.'), 'Where each worker is, from their open task. Tag scans below show the latest beds visited.') +
    '<h2 style="font-size:20px">Recent bed scans</h2>' + tbl;
}
function vExceptions(X, D) {
  const list = D.exceptions.slice().sort((a, b) => (b.open - a.open) || ((b.at || 0) - (a.at || 0)));
  const body = list.length ? '<div class="twrap"><table><thead><tr><th>Status</th><th>Source</th><th>Ref / bed</th><th>Exception</th><th>Reason</th><th>Signed off</th></tr></thead><tbody>' + list.map(e =>
    '<tr><td><span class="tag ' + (e.open ? 'red' : 'grey') + '">' + (e.open ? 'Open' : 'Signed off') + '</span></td><td>' + esc(e.src) + '</td><td><b>' + esc(e.ref) + '</b>' + (e.bed ? '<div class="sm">' + esc(e.bed) + '</div>' : '') + '</td><td>' + esc(e.type) + '</td><td>' + esc(e.note) + '</td><td>' + (e.by ? esc(e.by) : '') + (e.at ? '<div class="sm">' + esc(fmtStamp(e.at)) + '</div>' : '') + '</td></tr>').join('') + '</tbody></table></div>'
    : empty('No exceptions or manager overrides recorded.');
  return section('Exception overrides', X.openExc.length + ' open', body, 'Bed-assignment exceptions, cohort exceptions and manager overrides with their written reasons. Read-only here; sign-off happens in GH Manager.');
}
function events(X, D) {
  const ev = [];
  X.cohorts.forEach(c => {
    if (c.stage === 'PRE' && c.planD && c.bed && !c.ver) ev.push({d: addDays(c.planD, -2), k: 'Gate', t: 'Verify bed ' + c.bed + ' ready for ' + c.crop, cls: 'amber'});
    if ((c.stage === 'GROWING' || c.stage === 'READY') && c.bed) {
      const ls = lastScout(D, c), base = ls ? new Date(ls.at) : c.dobD;
      if (base) ev.push({d: addDays(new Date(base.getFullYear(), base.getMonth(), base.getDate()), SCOUT_DAYS), k: 'Scout', t: 'Scout ' + c.bed + ' (' + c.crop + ')', cls: 'blue'});
    }
  });
  return ev.sort((a, b) => a.d - b.d);
}
/* ---------- production calendars: Propagation / Planting / Harvest ---------- */
function calEvents() {
  const X = derive(S.data), out = [], DONE_H = ['HARVEST_COMPLETE', 'TERMINATED', 'RELEASED'];
  X.cohorts.forEach(c => {
    const base = c.dobD || c.planD; if (!base) return;
    const dob = iso(base), cancelled = c.status === 'TERMINATED' || c.status === 'RELEASED', planted = c.stage !== 'PRE' || cancelled, bed = c.bed || c.recBed || '';
    const b = {crop: c.crop, id: c.id, wave: c.wave, bed, done: planted, proposed: c.stage === 'PRE' && !c.bed && c.review === 'PROPOSED', dob, sow: c.lead > 0 ? iso(addDays(base, -c.lead)) : '', hard: c.hardN > 0 ? iso(addDays(base, -c.hardN)) : '', hs: c.hsD ? iso(c.hsD) : '', he: c.heD ? iso(c.heD) : '', pre: c.lead},
      X1 = (t, d, o) => out.push(Object.assign({}, b, {t, d}, o || {}));
    if (c.lead > 0) { X1('sow', b.sow); if (b.hard && b.hard !== dob) X1('harden', b.hard); X1('plant', dob); } else X1('direct', dob);
    if (b.hs) { const hd = DONE_H.includes(c.status); X1('ready', b.hs, {done: hd}); if (b.he && b.he !== b.hs) X1('close', b.he, {done: hd}); }
  });
  return out;
}
const CAL = GCAL.create({events: calEvents, today: () => iso(startOfToday()),
  bays: () => { const m = {}; ((S.data && S.data.beds) || []).forEach(b => { if (b.bay && !m[b.bay]) m[b.bay] = b.bayName || b.bay; }); return Object.keys(m).map(k => [k, k + ' ' + String(m[k]).replace(/^Greenhouse\s+/i, '')]); },
  note: () => 'Sow date = planting date minus nursery lead time (germination + nursery + harden-off). Crops without a nursery go straight into the bed on their planting date. Harvest window = planting date plus the crop\'s first-harvest days (min to max). Uses the actual planting date once a cohort is planted, otherwise the planned date.'});
function vCalendars() {
  return section('Production calendars', '', '<div id="gcal-host"></div>', 'Propagation, planting and harvest, each on its own calendar. Pick a tab, then switch between Month and Agenda.');
}
function vCalendar(X, D) {
  const ev = events(X, D), t = X.today, within = ev.filter(e => e.d >= addDays(t, -14));
  const show = (within.filter(e => e.d <= addDays(t, 60)).length ? within.filter(e => e.d <= addDays(t, 60)) : within).slice(0, 40);
  const wk = d => { const s = addDays(d, -d.getDay()); return s; };
  let html = '', cur = '';
  show.forEach(e => { const w = wk(e.d), key = iso(w); if (key !== cur) { cur = key; html += '<div class="week">Week of ' + esc(fmtDay(w)) + '</div>'; }
    html += '<div class="ev"><span class="d">' + esc(e.d.toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'})) + '</span><span class="tag ' + (e.cls || '') + '">' + esc(e.k) + '</span><span>' + esc(e.t) + (e.d < t ? ' <span class="sm">(past)</span>' : '') + '</span></div>'; });
  const first = ev.find(e => e.d >= t), gap = first && diffDays(first.d, t) > 60 ? 'Nothing is scheduled in the next 60 days. Showing the first scheduled items, starting ' + fmtDay(first.d) + '.' : '';
  return section('Verification & scouting', show.length ? show.length + ' items' : '', show.length ? html : empty('Nothing to verify or scout yet.'), 'Bed-ready verification gates (two days before planting) and the 7-day scout cycle. Nursery, planting and harvest dates are on the calendars above. ' + gap);
}
function vBeds(D) {
  const occ = {}; D.cohorts.forEach(c => { if (c.bed && !['RELEASED', 'TERMINATED', 'HARVEST_COMPLETE'].includes(c.status)) occ[c.bed] = c; });
  const bays = {}; D.beds.forEach(b => { (bays[b.bay] = bays[b.bay] || {name: b.bayName, zone: b.zone, beds: []}).beds.push(b); });
  const html = Object.keys(bays).map(k => { const y = bays[k]; const used = y.beds.filter(b => occ[b.id]).length;
    return '<div class="card ' + (used ? '' : 'grey') + '"><div class="ct"><span class="bed">' + esc(k) + '</span><span class="tag ' + (used ? '' : 'grey') + '">' + used + ' of ' + y.beds.length + ' beds in use</span></div><div class="nm">' + esc(y.name) + '</div><div class="sm">' + esc(y.zone) + '</div></div>'; }).join('');
  return section('Bays', Object.keys(bays).length, '<div class="grid">' + html + '</div>');
}

function render() {
  const D = S.data, X = derive(D);
  $('app').innerHTML = vKpis(X) + vCalendars() + vPending(X) + vActive(X) + vWatch(X, D) + vWorkers(X, D) + vExceptions(X, D) + vCalendar(X, D) + vBeds(D) +
    '<p class="note">' + (S.mode === 'live' ? 'Live from the VPOS-GH sheet. Read-only; refreshes every minute or when you tap Refresh.' : S.mode === 'sample' ? 'Sample activity is illustrative and is not saved anywhere. Tap Back to live for real data.' : 'Snapshot of the planned 2027 cohorts as exported ' + esc(SNAPSHOT_DATE) + '. Tap Refresh to retry the live connection.') + '</p>';
  CAL.mount($('gcal-host'));
}

/* ---------- sample activity (labelled, illustrative) ---------- */
function sampleData() {
  const D = JSON.parse(JSON.stringify(SNAPSHOT)), t = startOfToday(), at = n => Date.now() - n * 36e5, dd = n => iso(addDays(t, n));
  const mk = (i, over) => { const c = D.cohorts[i]; Object.assign(c, over, {bed: c.recBed}); return c; };
  const gA = mk(14, {status: 'GROWING', ver: true, dob: dd(-34), planned: dd(-34)});
  mk(30, {status: 'GROWING', ver: true, dob: dd(-8), planned: dd(-8)});
  const rdy = mk(40, {status: 'HARVEST_READY', ver: true, dob: dd(-52), planned: dd(-52), hs: dd(-3), he: dd(11)});
  const pend = mk(52, {status: 'PRE_PLANTING', ver: false, planned: dd(2)});
  mk(60, {status: 'PRE_PLANTING', ver: true, planned: dd(6)});
  const exc = mk(70, {status: 'PRE_PLANTING', ver: false, planned: dd(12)});
  D.cohorts.filter(c => !c.bed).slice(0, 3).forEach((c, i) => { c.planned = dd(20 + i * 7); });
  D.sessions = [{sid: 'S1', worker: 'lisa', name: 'Lisa Griffin', bed: rdy.bed, act: 'Harvest', st: 'ACTIVE', mins: 42, pr: ''}, {sid: 'S2', worker: 'james', name: 'James Clay', bed: gA.bed, act: 'Scouting', st: 'PAUSED', mins: 18, pr: 'Waiting on irrigation'}, {sid: 'S3', worker: 'jon', name: 'Jon Creem', bed: pend.bed, act: 'Pull Plastic & Drip', st: 'ASSIGNED', mins: ''}];
  D.pendingWork = [{id: 'LOG-900', bed: 'GH-1-R01', act: 'Pre-Plant Flush & Sanitization', worker: 'Jessica Luka', end: at(1), min: 19, qty: '1 bed'}];
  D.log = [{bed: 'GH-1-R01', act: 'Pre-Plant Flush & Sanitization', worker: 'Jessica Luka', end: at(1), min: 19, qty: '1 bed'}, {bed: D.cohorts[30].bed, act: 'Transplant', worker: 'Linda May', end: at(5), min: 95, qty: '120 plants'}];
  D.scouts = [{id: 'F1', at: at(24 * 6.5), worker: 'James Clay', bed: gA.bed, cohort: '', act: 'Pest scouting', result: 'Moderate', value: '', unit: '', sev: 2, note: 'Light aphids on lower leaves', status: 'OPEN'},
    {id: 'F2', at: at(30), worker: 'Jessica Luka', bed: rdy.bed, cohort: '', act: 'Disease scouting', result: 'High', value: '', unit: '', sev: 3, note: 'Leaf spot on two plants, isolate', status: 'OPEN'}];
  D.scans = [{code: 'QR-0001', bed: rdy.bed, cohort: rdy.id, at: at(1)}, {code: 'QR-0002', bed: gA.bed, cohort: gA.id, at: at(3)}];
  D.exceptions = [{src: 'Bed assignment', ref: exc.id, bed: exc.bed, type: 'Zoning: moved off recommended bed', note: 'Recommended bed unavailable', by: '', at: null, open: true},
    {src: 'Manager override', ref: 'SESS-000009', bed: pend.bed, type: 'Pull Plastic & Drip', note: 'Done before app rollout', by: 'Chris Kenny', at: at(70), open: false}];
  D.issues = [];
  return D;
}

/* ---------- wire up ---------- */
$('btnRefresh').addEventListener('click', () => { if (S.mode === 'sample') S.mode = 'off'; pull(true); });
$('btnDemo').addEventListener('click', () => {
  if (S.mode === 'sample') { S.mode = 'off'; S.data = SNAPSHOT; setState(); render(); pull(); return; }
  S.mode = 'sample'; S.data = sampleData(); say(''); setState(); render();
});
S.mode = 'load'; setState(); render(); pull();
setInterval(() => { if (S.mode === 'live' && !document.hidden) pull(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.mode === 'live' && Date.now() - S.at > 30000) pull(); });
</script>
